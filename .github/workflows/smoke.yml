name: Gauge smoke tests

# trigger smoke test execution on every commit to any branch except master
on:
  push:
    branches-ignore:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm ci
          curl -SsL https://downloads.gauge.org/stable | sh
          echo "$HOME/.gauge/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.gauge/bin:$PATH"
          gauge --version
          gauge install

      - name: Create Suitest config
        run: |
          cat > .suitestrc <<EOF
          {
            "tokenId": "${{ secrets.SUITEST_TOKEN_ID }}",
            "tokenPassword": "${{ secrets.SUITEST_TOKEN_PASSWORD }}",
            "deviceId": "${{ secrets.SUITEST_DEVICE_ID }}",
            "appConfigId": "${{ secrets.SUITEST_APP_CONFIG_ID }}",
            "logLevel": "normal"
          }
          EOF

      - name: Run tests
        run: |
          mkdir -p reports/logs
          set -o pipefail
          npm run start:smoke | tee reports/logs/stdout.log
          set +o pipefail
        env:
          CI: true

      - name: Report results to dashboard
        if: success() || failure()
        run: |
          curl -X POST \
            -H "x-api-key:${{ secrets.CALLIOPE_TOKEN }}" \
            -H "Content-Type:application/*" \
            --data "@reports/xml-report/result.xml" \
            "https://app.calliope.pro/api/v2/profile/765/report/import/junit"

      - name: Archive the reports and save them as artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Smoke test report
          path: reports
